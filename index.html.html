<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRD Conversation - English Fluency Training</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom right, #071426, #0c2541);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 15px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.05);
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }

        /* LOGO ELEGANTE */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-box {
            display: inline-block;
            background: #0b1f33;
            padding: 25px 40px;
            border-radius: 14px;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.5);
        }

        .logo h1 {
            margin: 0;
            color: #ffffff;
            font-size: 34px;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .logo span {
            color: #71b2ff;
        }

        .logo p {
            margin: 6px 0 0;
            color: #d8e7ff;
            font-size: 16px;
            font-style: italic;
        }

        /* SECCIÓN QUIÉNES APLICAN */
        .requisitos {
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 35px;
        }

        .requisitos h2 {
            text-align: center;
            margin-bottom: 18px;
            font-size: 24px;
            color: #e1ecff;
        }

        .requisitos ul {
            list-style: none;
            padding-left: 0;
            font-size: 18px;
            line-height: 1.9;
        }

        /* FORMULARIO */
        label {
            display: block;
            margin: 15px 0 6px;
            font-size: 16px;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #1a73e8;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
